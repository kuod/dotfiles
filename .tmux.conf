# ─── Prefix key ─────────────────────────────────────────────────────────────
# Remap prefix from the default C-b to C-a (screen-style, easier to reach)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix   # press C-a twice to send a literal C-a to the terminal

# ─── Focus events ───────────────────────────────────────────────────────────
# Lets terminal apps (e.g. vim) detect when a pane gains/loses focus
set -g focus-events on

# ─── Pane splitting ─────────────────────────────────────────────────────────
# Use | for a vertical split (side by side) and - for a horizontal split (top/bottom)
bind | split-window -h
bind - split-window -v
unbind '"'   # remove old horizontal-split binding
unbind %     # remove old vertical-split binding
